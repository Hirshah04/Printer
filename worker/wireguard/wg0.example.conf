# Example WireGuard Client Configuration for Cloud Print Worker
# Replace the keys, addresses, and endpoint with values from your router's WireGuard server

[Interface]
# The private IP address assigned to this worker inside the WireGuard subnet
Address = 10.14.0.2/24
# Cloud Worker's WireGuard private key (generated during setup)
PrivateKey = REPLACE_WITH_WORKER_WIREGUARD_PRIVATE_KEY
DNS = 1.1.1.1, 8.8.8.8

[Peer]
# Router WireGuard Server Public Key
PublicKey = REPLACE_WITH_ROUTER_WIREGUARD_SERVER_PUBLIC_KEY
# Router public IP or DDNS hostname and port (e.g., yourname.asuscomm.com:51820)
Endpoint = your-home-router-ddns.example.com:51820
# Route only traffic destined for the VPN subnet and the home/office LAN subnet
# Example: 10.14.0.0/24 (VPN) and 192.168.1.0/24 (LAN where printer resides)
AllowedIPs = 10.14.0.0/24, 192.168.1.0/24
# Keep connection alive through NAT firewalls
PersistentKeepalive = 25
