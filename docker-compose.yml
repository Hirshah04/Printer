version: '3.8'

services:
  # MongoDB Atlas alternative for local self-hosting / offline development
  mongodb:
    image: mongo:7.0
    container_name: printer-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: remote_printer_hub
    volumes:
      - mongo_data:/data/db

  # Cloud Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: printer-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/remote_printer_hub
      JWT_SECRET: dev_super_secret_jwt_key_replace_for_production_env_123456789
      WORKER_API_KEY: worker-secret-token-change-this-to-a-high-entropy-random-string
      STORAGE_TYPE: local
      CORS_ORIGIN: "*"
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/uploads

  # Cloud Print Worker Daemon (maintains WireGuard VPN to Router)
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: printer-worker
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      BACKEND_URL: http://backend:5000
      WORKER_API_KEY: worker-secret-token-change-this-to-a-high-entropy-random-string
      WORKER_ID: cloud-print-worker-docker-1
      DEFAULT_PRINTER_IP: 192.168.1.150
      GATEWAY_IP: 10.14.0.1
      WIREGUARD_INTERFACE: wg0
    depends_on:
      - backend
    volumes:
      # Mount your router-exported client WireGuard configuration
      - ./worker/wireguard/wg0.conf:/etc/wireguard/wg0.conf:ro

  # Frontend Web Application (Development / Production Preview)
  frontend:
    image: node:20-alpine
    container_name: printer-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_uploads:
