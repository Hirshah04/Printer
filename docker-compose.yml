version: '3.8'

services:
  # Cloud Backend API (File-backed storage, no database required)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: printer-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      PRINTER_IP: "192.168.1.37"
      PRINTER_PORT: 631
      PRINTER_ENDPOINT: "/ipp/printer"
      WORKER_API_KEY: worker-secret-token-change-this-to-a-high-entropy-random-string
      STORAGE_TYPE: local
      CORS_ORIGIN: "*"
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads

  # Cloud Print Worker Daemon (WireGuard VPN Tunnel to Router -> 192.168.1.37)
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: printer-worker
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      BACKEND_URL: http://backend:5000
      WORKER_API_KEY: worker-secret-token-change-this-to-a-high-entropy-random-string
      WORKER_ID: cloud-print-worker-docker-1
      DEFAULT_PRINTER_IP: "192.168.1.37"
      GATEWAY_IP: 10.14.0.1
      WIREGUARD_INTERFACE: wg0
    depends_on:
      - backend
    volumes:
      - ./worker/wireguard/wg0.conf:/etc/wireguard/wg0.conf:ro

  # Frontend Web Application (Two Pages: Print Document & History)
  frontend:
    image: node:20-alpine
    container_name: printer-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  backend_data:
  backend_uploads:
